    <rect x="462" y="164" width="34" height="34" rx="8" fill="#102033"/>
    <rect x="506" y="164" width="34" height="34" rx="8" fill="#1769E0"/>
    <rect x="550" y="164" width="34" height="34" rx="8" fill="#EAF2FF"/>
