<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="הצוות של דפוס ראובן בסטודיו העיצוב לצד מכונת הדפוס">
  <defs>
    <linearGradient id="ab" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F2F5FA"/><stop offset="1" stop-color="#E6EBF2"/></linearGradient>
    <linearGradient id="abl" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4A94FF"/><stop offset="1" stop-color="#1769E0"/></linearGradient>
    <linearGradient id="an" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1B3A5B"/><stop offset="1" stop-color="#102033"/></linearGradient>
    <filter id="as" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#102033" flood-opacity=".18"/></filter>
  </defs>
  <rect width="800" height="600" fill="url(#ab)"/>
  <rect y="470" width="800" height="130" fill="#DCE2EA"/>

  <!-- printing press in the back -->
  <g filter="url(#as)">
    <rect x="470" y="150" width="290" height="230" rx="14" fill="url(#an)"/>
    <rect x="500" y="182" width="130" height="86" rx="8" fill="#22405F"/>
    <rect x="518" y="202" width="94" height="10" rx="5" fill="#93BDFF" opacity=".6"/>
    <rect x="518" y="222" width="66" height="8" rx="4" fill="#93BDFF" opacity=".35"/>
    <circle cx="694" cy="222" r="40" fill="#22405F"/>
    <circle cx="694" cy="222" r="18" fill="url(#abl)"/>
    <rect x="500" y="300" width="230" height="48" rx="8" fill="#F3F1EC"/>
    <rect x="524" y="316" width="120" height="8" rx="4" fill="#102033" opacity=".2"/>
    <rect x="524" y="330" width="90" height="6" rx="3" fill="#102033" opacity=".14"/>
    <rect x="490" y="380" width="34" height="90" fill="#22405F"/>
    <rect x="706" y="380" width="34" height="90" fill="#22405F"/>
  </g>

  <!-- desk -->
  <g filter="url(#as)">
    <rect x="60" y="404" width="420" height="20" rx="8" fill="#C9D2DC"/>
    <rect x="96" y="424" width="18" height="70" fill="#B7C1CD"/>
    <rect x="426" y="424" width="18" height="70" fill="#B7C1CD"/>
    <!-- monitor -->
    <rect x="150" y="220" width="250" height="164" rx="10" fill="url(#an)"/>
    <rect x="164" y="234" width="222" height="126" rx="6" fill="#F7F9FC"/>
    <rect x="184" y="252" width="90" height="90" rx="6" fill="#EAF2FF"/>
    <circle cx="229" cy="288" r="22" fill="url(#abl)"/>
    <rect x="184" y="326" width="66" height="8" rx="4" fill="#102033" opacity=".3"/>
    <rect x="292" y="252" width="74" height="8" rx="4" fill="#102033" opacity=".2"/>
    <rect x="292" y="270" width="56" height="8" rx="4" fill="#102033" opacity=".14"/>
    <rect x="292" y="288" width="66" height="8" rx="4" fill="#102033" opacity=".14"/>
    <rect x="292" y="322" width="54" height="18" rx="9" fill="#1769E0"/>
    <rect x="248" y="384" width="54" height="20" fill="#22405F"/>
  </g>

  <!-- designer -->
  <g filter="url(#as)">
    <circle cx="120" cy="286" r="38" fill="#E0B89C"/>
    <path d="M84 274c0-26 18-42 36-42s36 16 36 42c-10-12-24-16-36-16s-26 4-36 16z" fill="#3A3630"/>
    <path d="M60 404c0-46 27-78 60-78s60 32 60 78z" fill="url(#abl)"/>
    <rect x="104" y="336" width="32" height="18" fill="#E0B89C"/>
  </g>

  <!-- printed samples on desk -->
  <g filter="url(#as)">
    <rect x="322" y="368" width="120" height="36" rx="5" fill="#FFF"/>
    <rect x="338" y="380" width="46" height="7" rx="3" fill="#1769E0" opacity=".7"/>
    <rect x="338" y="392" width="70" height="5" rx="2" fill="#102033" opacity=".2"/>
  </g>
</svg>
