<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="שלט חזית לעסק עם אותיות תלת מימד">
  <defs>
    <linearGradient id="gb" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#EAF2FF"/><stop offset="1" stop-color="#F7F7F5"/></linearGradient>
    <linearGradient id="gn" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1B3A5B"/><stop offset="1" stop-color="#102033"/></linearGradient>
    <linearGradient id="gbl" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4A94FF"/><stop offset="1" stop-color="#1769E0"/></linearGradient>
    <filter id="gs" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#102033" flood-opacity=".24"/></filter>
  </defs>
  <rect width="800" height="600" fill="url(#gb)"/>
  <!-- building facade -->
  <rect x="60" y="60" width="680" height="480" rx="10" fill="#F0F1F3"/>
  <rect x="60" y="330" width="680" height="210" fill="#E3E6EA"/>
  <rect x="120" y="370" width="220" height="170" rx="6" fill="#D2DBE6"/>
