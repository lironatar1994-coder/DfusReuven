    <rect x="110" y="120" width="580" height="160" rx="12" fill="url(#gn)"/>
    <rect x="110" y="120" width="580" height="160" rx="12" fill="none" stroke="#2C4E72" stroke-width="2"/>
    <rect x="152" y="166" width="68" height="68" rx="18" fill="url(#gbl)"/>
    <rect x="244" y="176" width="230" height="24" rx="12" fill="#FFF" opacity=".95"/>
    <rect x="244" y="214" width="150" height="15" rx="7" fill="#93BDFF" opacity=".85"/>
    <rect x="530" y="176" width="112" height="58" rx="10" fill="#1769E0" opacity=".22"/>
    <rect x="552" y="196" width="68" height="8" rx="4" fill="#93BDFF" opacity=".7"/>
