    <path d="M300 120l52-26 30 22 30-22 52 26 26 62-44 18v168H318V300l-44-18z" fill="#FFF"/>
    <path d="M352 94c0 18 14 30 30 30s30-12 30-30" fill="none" stroke="#DDE2E9" stroke-width="3"/>
    <rect x="344" y="212" width="76" height="12" rx="6" fill="url(#bl5)"/>
    <rect x="358" y="234" width="48" height="8" rx="4" fill="#102033" opacity=".3"/>
  </g>

  <!-- mug -->
  <g filter="url(#s5)">
