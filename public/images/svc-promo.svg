    <path d="M236 262h34a34 34 0 0 1 0 68h-34" fill="none" stroke="#22405F" stroke-width="18" stroke-linecap="round"/>
    <circle cx="150" cy="292" r="26" fill="url(#bl5)"/>
    <rect x="112" y="336" width="98" height="9" rx="4" fill="#FFF" opacity=".7"/>
  </g>

  <!-- pens -->
  <g filter="url(#s5)" transform="rotate(14 640 300)">
    <rect x="596" y="150" width="24" height="220" rx="12" fill="url(#bl5)"/>
    <path d="M596 370h24l-12 30z" fill="#102033"/>
    <rect x="596" y="150" width="24" height="40" rx="12" fill="#102033"/>
    <rect x="640" y="176" width="24" height="220" rx="12" fill="#FFF"/>
    <path d="M640 396h24l-12 30z" fill="#102033"/>
    <rect x="640" y="176" width="24" height="40" rx="12" fill="#102033"/>
  </g>

  <!-- magnets -->
  <g filter="url(#s5)">
    <rect x="86" y="70" width="118" height="90" rx="10" fill="#FFF"/>
    <rect x="106" y="94" width="26" height="26" rx="7" fill="url(#bl5)"/>
    <rect x="142" y="100" width="44" height="7" rx="3" fill="#102033" opacity=".65"/>
    <rect x="142" y="114" width="30" height="6" rx="3" fill="#102033" opacity=".28"/>
    <rect x="106" y="134" width="76" height="6" rx="3" fill="#102033" opacity=".18"/>
