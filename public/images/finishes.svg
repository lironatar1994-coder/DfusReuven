<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="דוגמאות נייר וגימורים: פויל, הבלטה, למינציה וצבעים">
  <defs>
    <linearGradient id="qb" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F8F7F4"/><stop offset="1" stop-color="#EBEEF3"/></linearGradient>
    <linearGradient id="qf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7E6BC"/><stop offset=".4" stop-color="#D3B071"/>
      <stop offset=".68" stop-color="#FAF0D8"/><stop offset="1" stop-color="#C29C55"/>
    </linearGradient>
    <linearGradient id="qs" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E9EDF2"/><stop offset=".45" stop-color="#B9C3CF"/>
      <stop offset=".7" stop-color="#F2F5F8"/><stop offset="1" stop-color="#A9B4C1"/>
    </linearGradient>
    <linearGradient id="qbl" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4A94FF"/><stop offset="1" stop-color="#1769E0"/></linearGradient>
    <filter id="qsh" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#102033" flood-opacity=".18"/></filter>
    <filter id="emb" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1.5" dy="1.5" stdDeviation="0" flood-color="#FFF" flood-opacity=".9"/>
      <feDropShadow dx="-1.5" dy="-1.5" stdDeviation="0" flood-color="#102033" flood-opacity=".22"/>
    </filter>
  </defs>
  <rect width="800" height="600" fill="url(#qb)"/>

  <!-- fanned paper swatches -->
  <g filter="url(#qsh)">
    <g transform="rotate(-14 220 320)"><rect x="70" y="180" width="150" height="290" rx="8" fill="#102033"/></g>
    <g transform="rotate(-7 220 320)"><rect x="110" y="180" width="150" height="290" rx="8" fill="url(#qbl)"/></g>
    <g transform="rotate(0 220 320)"><rect x="150" y="180" width="150" height="290" rx="8" fill="#EAF2FF"/></g>
    <g transform="rotate(7 220 320)"><rect x="190" y="180" width="150" height="290" rx="8" fill="url(#qf)"/></g>
    <g transform="rotate(14 220 320)"><rect x="230" y="180" width="150" height="290" rx="8" fill="url(#qs)"/></g>
  </g>

  <!-- embossed card -->
  <g filter="url(#qsh)">
    <rect x="440" y="120" width="290" height="170" rx="12" fill="#F6F3EE"/>
    <g filter="url(#emb)">
      <circle cx="500" cy="182" r="26" fill="none" stroke="#DED8CE" stroke-width="6"/>
      <rect x="546" y="172" width="140" height="14" rx="7" fill="#E6E1D8"/>
      <rect x="546" y="196" width="96" height="10" rx="5" fill="#E6E1D8"/>
    </g>
    <rect x="474" y="244" width="212" height="6" rx="3" fill="#102033" opacity=".12"/>
  </g>

  <!-- foil card -->
  <g filter="url(#qsh)">
    <rect x="440" y="318" width="290" height="170" rx="12" fill="#102033"/>
    <rect x="470" y="348" width="52" height="52" rx="14" fill="url(#qf)"/>
    <rect x="540" y="358" width="150" height="14" rx="7" fill="url(#qf)"/>
    <rect x="540" y="382" width="100" height="9" rx="4" fill="url(#qf)" opacity=".7"/>
    <rect x="470" y="428" width="216" height="6" rx="3" fill="#FFF" opacity=".2"/>
    <rect x="470" y="446" width="170" height="6" rx="3" fill="#FFF" opacity=".14"/>
  </g>

  <!-- color chips -->
  <g filter="url(#qsh)">
    <rect x="80" y="500" width="60" height="60" rx="10" fill="#102033"/>
    <rect x="150" y="500" width="60" height="60" rx="10" fill="#1769E0"/>
    <rect x="220" y="500" width="60" height="60" rx="10" fill="#EAF2FF"/>
    <rect x="290" y="500" width="60" height="60" rx="10" fill="url(#qf)"/>
  </g>
</svg>
