<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="דפוס לעסקים – כרטיסי ביקור, ניירת משרדית וקטלוגים ממותגים">
  <defs>
    <linearGradient id="b1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F7F7F5"/><stop offset="1" stop-color="#E7ECF3"/></linearGradient>
    <linearGradient id="n1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#17324F"/><stop offset="1" stop-color="#102033"/></linearGradient>
    <linearGradient id="bl1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3E8BFF"/><stop offset="1" stop-color="#1769E0"/></linearGradient>
    <linearGradient id="p1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF"/><stop offset="1" stop-color="#F0EEE9"/></linearGradient>
    <filter id="s1" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#102033" flood-opacity=".2"/></filter>
  </defs>
  <rect width="800" height="500" fill="url(#b1)"/>
  <circle cx="690" cy="70" r="130" fill="#1769E0" opacity=".07"/>

  <!-- letterhead -->
  <g filter="url(#s1)" transform="rotate(-5 300 250)">
    <rect x="150" y="60" width="270" height="370" rx="8" fill="url(#p1)"/>
    <rect x="182" y="94" width="30" height="30" rx="8" fill="url(#bl1)"/>
    <rect x="222" y="102" width="76" height="9" rx="4" fill="#102033" opacity=".8"/>
    <rect x="222" y="117" width="50" height="6" rx="3" fill="#102033" opacity=".35"/>
    <rect x="182" y="168" width="206" height="7" rx="3" fill="#102033" opacity=".18"/>
    <rect x="182" y="186" width="180" height="7" rx="3" fill="#102033" opacity=".14"/>
    <rect x="182" y="204" width="196" height="7" rx="3" fill="#102033" opacity=".14"/>
    <rect x="182" y="222" width="140" height="7" rx="3" fill="#102033" opacity=".14"/>
    <rect x="182" y="262" width="206" height="7" rx="3" fill="#102033" opacity=".14"/>
    <rect x="182" y="280" width="164" height="7" rx="3" fill="#102033" opacity=".14"/>
    <rect x="182" y="386" width="206" height="4" rx="2" fill="#1769E0" opacity=".5"/>
  </g>

  <!-- catalog -->
  <g filter="url(#s1)" transform="rotate(6 570 300)">
    <rect x="446" y="150" width="230" height="290" rx="8" fill="url(#n1)"/>
    <rect x="476" y="186" width="36" height="36" rx="10" fill="url(#bl1)"/>
    <rect x="476" y="248" width="150" height="12" rx="6" fill="#FFF" opacity=".9"/>
    <rect x="476" y="272" width="106" height="8" rx="4" fill="#93BDFF" opacity=".7"/>
    <rect x="476" y="330" width="170" height="6" rx="3" fill="#FFF" opacity=".2"/>
    <rect x="476" y="346" width="140" height="6" rx="3" fill="#FFF" opacity=".16"/>
    <rect x="476" y="386" width="86" height="26" rx="13" fill="#1769E0"/>
  </g>

  <!-- business cards -->
  <g filter="url(#s1)">
    <rect x="292" y="330" width="220" height="128" rx="9" fill="#EBE7DF"/>
    <rect x="282" y="318" width="220" height="128" rx="9" fill="#FFF"/>
    <rect x="308" y="346" width="28" height="28" rx="8" fill="url(#bl1)"/>
    <rect x="346" y="352" width="72" height="9" rx="4" fill="#102033" opacity=".85"/>
    <rect x="346" y="366" width="48" height="6" rx="3" fill="#102033" opacity=".35"/>
    <rect x="308" y="400" width="110" height="6" rx="3" fill="#102033" opacity=".18"/>
    <rect x="308" y="414" width="84" height="6" rx="3" fill="#102033" opacity=".14"/>
  </g>
</svg>
