<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="הזמנות לחתונה ולאירועים עם הטבעה והדפסת פויל">
  <defs>
    <linearGradient id="b2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F8F6F2"/><stop offset="1" stop-color="#EDE9E1"/></linearGradient>
    <linearGradient id="f2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7E6BC"/><stop offset=".45" stop-color="#D3B071"/>
      <stop offset=".7" stop-color="#FAF0D8"/><stop offset="1" stop-color="#C29C55"/>
    </linearGradient>
    <linearGradient id="p2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFDF9"/><stop offset="1" stop-color="#F2EDE3"/></linearGradient>
    <filter id="s2" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#102033" flood-opacity=".2"/></filter>
  </defs>
  <rect width="800" height="500" fill="url(#b2)"/>
  <circle cx="120" cy="80" r="120" fill="#D3B071" opacity=".12"/>

  <!-- envelope -->
  <g filter="url(#s2)" transform="rotate(-4 250 320)">
    <rect x="110" y="230" width="290" height="200" rx="8" fill="#EFE9DE"/>
    <path d="M110 238l145 104 145-104" fill="none" stroke="#D9D0C0" stroke-width="4"/>
    <circle cx="255" cy="376" r="24" fill="url(#f2)"/>
  </g>

  <!-- main invitation -->
  <g filter="url(#s2)" transform="rotate(4 430 240)">
    <rect x="300" y="50" width="260" height="360" rx="6" fill="url(#p2)"/>
    <rect x="322" y="72" width="216" height="316" rx="3" fill="none" stroke="url(#f2)" stroke-width="2"/>
    <path d="M430 118c-14-20-44-14-44 8 0 20 30 34 44 46 14-12 44-26 44-46 0-22-30-28-44-8z" fill="url(#f2)"/>
    <rect x="356" y="212" width="148" height="14" rx="7" fill="#102033" opacity=".82"/>
    <rect x="380" y="242" width="100" height="8" rx="4" fill="#102033" opacity=".38"/>
    <rect x="340" y="286" width="180" height="6" rx="3" fill="#102033" opacity=".18"/>
    <rect x="362" y="302" width="136" height="6" rx="3" fill="#102033" opacity=".18"/>
    <rect x="392" y="340" width="76" height="24" rx="12" fill="url(#f2)"/>
  </g>

  <!-- thank you cards -->
  <g filter="url(#s2)">
    <rect x="588" y="268" width="150" height="200" rx="6" fill="#EAF2FF"/>
    <rect x="606" y="286" width="114" height="164" rx="3" fill="none" stroke="#1769E0" stroke-width="1.5" opacity=".5"/>
    <rect x="626" y="352" width="74" height="9" rx="4" fill="#1769E0" opacity=".8"/>
    <rect x="640" y="372" width="46" height="6" rx="3" fill="#102033" opacity=".3"/>
  </g>
</svg>
