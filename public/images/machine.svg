<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="מכונת דפוס אופסט בעבודה בבית הדפוס">
  <defs>
    <linearGradient id="mb" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#EDF1F6"/><stop offset="1" stop-color="#DFE5ED"/></linearGradient>
    <linearGradient id="mn" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1E4066"/><stop offset="1" stop-color="#102033"/></linearGradient>
    <linearGradient id="mbl" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4A94FF"/><stop offset="1" stop-color="#1769E0"/></linearGradient>
    <filter id="ms" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#102033" flood-opacity=".22"/></filter>
  </defs>
  <rect width="800" height="600" fill="url(#mb)"/>
  <rect y="470" width="800" height="130" fill="#D3DAE3"/>

  <g filter="url(#ms)">
    <rect x="60" y="150" width="680" height="320" rx="18" fill="url(#mn)"/>
    <!-- towers -->
    <rect x="100" y="190" width="140" height="240" rx="10" fill="#22456B"/>
    <rect x="260" y="190" width="140" height="240" rx="10" fill="#1D3C5D"/>
    <rect x="420" y="190" width="140" height="240" rx="10" fill="#22456B"/>
    <!-- rollers -->
    <circle cx="170" cy="266" r="44" fill="#0E1C2C"/><circle cx="170" cy="266" r="18" fill="#00A3E0"/>
    <circle cx="330" cy="266" r="44" fill="#0E1C2C"/><circle cx="330" cy="266" r="18" fill="#E5007E"/>
    <circle cx="490" cy="266" r="44" fill="#0E1C2C"/><circle cx="490" cy="266" r="18" fill="#F5D400"/>
    <!-- control panel -->
    <rect x="592" y="190" width="120" height="150" rx="10" fill="#0E1C2C"/>
    <rect x="610" y="210" width="84" height="56" rx="6" fill="url(#mbl)" opacity=".9"/>
    <circle cx="626" cy="292" r="9" fill="#25D366"/>
    <circle cx="654" cy="292" r="9" fill="#93BDFF"/>
    <circle cx="682" cy="292" r="9" fill="#3E5273"/>
    <rect x="610" y="314" width="84" height="8" rx="4" fill="#FFF" opacity=".2"/>
    <!-- paper feed -->
    <rect x="100" y="368" width="460" height="12" rx="6" fill="#93BDFF" opacity=".5"/>
    <rect x="120" y="398" width="440" height="32" rx="6" fill="#F3F1EC"/>
    <rect x="146" y="410" width="120" height="8" rx="4" fill="#102033" opacity=".18"/>
    <rect x="290" y="410" width="80" height="8" rx="4" fill="#1769E0" opacity=".5"/>
  </g>

  <!-- output stack -->
  <g filter="url(#ms)">
    <rect x="270" y="480" width="270" height="14" rx="4" fill="#FFF"/>
    <rect x="278" y="496" width="254" height="14" rx="4" fill="#F1EFEA"/>
    <rect x="286" y="512" width="238" height="14" rx="4" fill="#E7E4DD"/>
  </g>
</svg>
