  <g filter="url(#s3)">
    <rect x="70" y="252" width="420" height="140" rx="6" fill="#FFF"/>
    <rect x="70" y="252" width="128" height="140" rx="6" fill="url(#n3)"/>
    <rect x="98" y="292" width="34" height="34" rx="9" fill="url(#bl3)"/>
    <rect x="98" y="342" width="72" height="8" rx="4" fill="#FFF" opacity=".7"/>
    <rect x="226" y="292" width="180" height="14" rx="7" fill="#102033" opacity=".8"/>
    <rect x="226" y="320" width="130" height="9" rx="4" fill="#1769E0" opacity=".75"/>
    <rect x="226" y="348" width="210" height="7" rx="3" fill="#102033" opacity=".18"/>
    <circle cx="86" cy="268" r="5" fill="#A9B2BD"/>
    <circle cx="474" cy="268" r="5" fill="#A9B2BD"/>
    <circle cx="86" cy="376" r="5" fill="#A9B2BD"/>
    <circle cx="474" cy="376" r="5" fill="#A9B2BD"/>
