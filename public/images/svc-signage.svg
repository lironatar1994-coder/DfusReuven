    <rect x="158" y="124" width="96" height="10" rx="5" fill="#93BDFF" opacity=".8"/>
    <rect x="90" y="190" width="16" height="42" fill="#C8CDD4"/>
    <rect x="454" y="190" width="16" height="42" fill="#C8CDD4"/>
  </g>

  <!-- roll-up banner -->
  <g filter="url(#s3)">
    <rect x="556" y="60" width="180" height="330" rx="6" fill="#FFF"/>
    <rect x="556" y="60" width="180" height="120" rx="6" fill="url(#bl3)"/>
    <rect x="580" y="94" width="36" height="36" rx="10" fill="#FFF" opacity=".92"/>
    <rect x="580" y="146" width="106" height="10" rx="5" fill="#FFF" opacity=".85"/>
    <rect x="580" y="212" width="132" height="8" rx="4" fill="#102033" opacity=".22"/>
    <rect x="580" y="232" width="106" height="8" rx="4" fill="#102033" opacity=".16"/>
    <rect x="580" y="252" width="118" height="8" rx="4" fill="#102033" opacity=".16"/>
    <rect x="580" y="300" width="86" height="26" rx="13" fill="#1769E0"/>
    <rect x="540" y="386" width="212" height="18" rx="9" fill="#B9C1CB"/>
    <rect x="640" y="404" width="12" height="30" fill="#C8CDD4"/>
  </g>

